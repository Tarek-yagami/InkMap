name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docling pulls in opencv-python (not the headless build), which needs
      # libGL at import time even though our tests don't exercise Docling's
      # PDF pipeline directly - importing src.ingestion is enough to need it.
      - name: Install system libs for opencv (docling dependency)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v
