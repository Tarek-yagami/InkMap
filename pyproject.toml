[project]
name = "inkmap"
version = "0.1.0"
description = "Turns a research paper into an interactive knowledge graph of its entities and relationships."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "openai>=1.40",
    "pydantic>=2.7",
    "langchain-text-splitters>=0.2",
    "docling>=2.0",
    "python-dotenv>=1.0",
    "aiolimiter>=1.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
